name: Release

# Trigger only when a version tag is pushed (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Required for ncipollo/release-action to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # Clone the private source repo. Embeds the PAT in the URL — reliable on
      # Windows without needing git extraheader or url.rewrite tricks.
      - name: Checkout source from LightwareMonitorSource
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }} # 👈 THIS MAPS THE SECRET TO THE BASH SCRIPT
        run: |
          token="$SOURCE_REPO_TOKEN"
          url="https://x-access-token:${token}@github.com/UniversalFactorApps/LightwareMonitorSource.git"

          # Force empty the directory to prevent git conflicts on the runner machine
          rm -rf *

          git clone --depth 1 --branch main "$url" "$GITHUB_WORKSPACE"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native telemetry DLL (Release x64)
        run: |
          MSBuild.exe LightwareMonitor.Core/LightwareMonitor.Core.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /t:Build /v:m

      - name: Run tests
        run: dotnet test LightwareMonitor.Tests/LightwareMonitor.Tests.csproj --verbosity normal

      - name: Publish single-file executable
        run: |
          dotnet publish LightwareMonitor.UI/LightwareMonitor.UI.csproj `
            -c Release -r win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o publish

      - name: Fetch public README and assets
        run: git fetch https://github.com/UniversalFactorApps/LightwareMonitor.git main:public-main --depth=1

      - name: Package release
        shell: pwsh
        run: |
          $publicFiles = @("publish/LightwareMonitor.UI.exe")
          if (Test-Path "public-main/README.md") { $publicFiles += "public-main/README.md" }
          if (Test-Path "public-main/CHANGELOG.md") { $publicFiles += "public-main/CHANGELOG.md" }
          if (Test-Path "public-main/PREMIUM.md") { $publicFiles += "public-main/PREMIUM.md" }
          Compress-Archive -Path $publicFiles `
            -DestinationPath "LightwareMonitor-${{ github.ref_name }}.zip" `
            -Force

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            LightwareMonitor-${{ github.ref_name }}.zip
          allowUpdates: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}