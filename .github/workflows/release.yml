name: Release

# Trigger only when a version tag is pushed (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

# Required for ncipollo/release-action to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch README from main
        # Keep README in sync with the latest main branch so releases
        # always carry the current version of the docs.
        run: git fetch origin main:refs/remotes/origin/main --depth=1 && git checkout origin/main -- README.md

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Setup MSVC build tools (cl.exe + MSBuild) for the C++ vcxproj.
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Build native C++ DLL — outputs to LightwareMonitor.Core\x64\Release\
      - name: Build native telemetry DLL (Release x64)
        run: |
          MSBuild.exe LightwareMonitor.Core/LightwareMonitor.Core.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /t:Build /v:m

      # Build and run all tests. Exits non-zero (fails the build) if any test fails.
      - name: Run tests
        run: dotnet test LightwareMonitor.Tests/LightwareMonitor.Tests.csproj --verbosity normal

      # Publish .NET app — CopyNativeCoreDll target picks up the native DLL
      # from LightwareMonitor.Core\x64\Release\ and embeds it into the exe.
      - name: Publish single-file executable
        run: |
          dotnet publish LightwareMonitor.UI/LightwareMonitor.UI.csproj `
            -c Release -r win-x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -o publish

      # Package everything into a single zip for easy one-file download.
      - name: Package release
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/LightwareMonitor.UI.exe", "README.md" `
            -DestinationPath "LightwareMonitor-Portable-${{ github.ref_name }}.zip" `
            -Force

      # Create GitHub release (no source code archives).
      # ncipollo/release-action uploads only the specified files and avoids
      # GitHub's default Source code (zip)/(tar.gz) auto-archives.
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            LightwareMonitor-Portable-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
